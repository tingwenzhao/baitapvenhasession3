<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport">
        <title>Tìm kiếm và lọc sản phẩm</title>
    </head>
    <body>
        <h1>Tìm Kiếm Sản Phẩm</h1>
        <br>
        <form>
            <label for="keyword">Từ khóa tìm kiếm</label>
            <br>
            <input type="search" id="keyword" name="keyword">
            <br><br>
            <label for="Loại sản phẩm">Loại sản phẩm</label>
            <br>
            <select id="Loại sản phẩm" name="Loại sản phẩm">
                <option value="Điện tử">Điện tử</option>
                <option value="Nhà bếp">Nhà bếp</option>
                <option value="Xe cộ">Xe cộ</option>
                <option value="Quần áo">Quần áo</option>
            </select>
            <br><br>
            <button type="submit">Tìm kiếm</button>
        </form>
    </body>
</html>
