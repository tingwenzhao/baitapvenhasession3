<!DOCTYPE html>
<html lang="en">
    <head>
      <title>Tạo trang form liên hệ</title>
    </head>
    <body>
        <h1>Liên Hệ Với Chúng Tôi</h1>
        <label for="name">Họ và tên</label>
        <br>
        <input type="text" id="name" name="name" requierd/>
        <br><br>
        <label for="Email">Email</label>
        <br>
        <input type="email" id="email" name="email" requierd/>
        <br><br>
        <label for="Tin nhắn">Tin nhắn</label>
        <br>
        <textarea id="Tin nhắn" name="Tin nhắn" cols="50" rows="5" requierd></textarea>
        <br><br>
        <input type="submit" value="Gửi"/>
    </body>
    
</html>
